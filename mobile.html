<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stopwatch — Mobile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<style>
  /* =========================================================
     MOBILE BUILD — Edit only this file for mobile changes
     ========================================================= */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    background: #000;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  /* BACK LINK */
  .back-link {
    position: fixed;
    top: 12px; left: 16px;
    color: #444;
    font-size: 13px;
    text-decoration: none;
    z-index: 70;
    padding: 4px 10px;
    border: 1px solid #333;
    border-radius: 6px;
  }
  .back-link:active { background: #1a1a1a; color: #aaa; }

  /* TOP BAR */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
    background: rgba(17,17,17,0.95);
    border-bottom: 1px solid #1a1a1a;
    z-index: 50;
    min-height: 40px;
  }
  .top-bar .top-left { display: flex; flex-direction: column; }
  .top-bar .top-time {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .top-bar .top-date { color: #555; font-size: 10px; }

  /* TIMER */
  .timer-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 50px 10px 0;
  }
  .timer {
    color: #fff;
    font-size: 22vw;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .timer.paused { color: #ff4444; }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 8px;
    width: 100%;
    max-width: 500px;
  }
  .btn {
    flex: 1;
    min-width: 60px;
    background: none;
    border: 2px solid;
    border-radius: 12px;
    padding: 12px 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.12s;
    text-align: center;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.94); filter: brightness(1.2); }
  .btn:disabled { opacity: 0.25; }
  .btn.green  { border-color: #4CAF50; color: #4CAF50; }
  .btn.green:disabled { border-color: #2a5a2a; color: #2a5a2a; }
  .btn.red    { border-color: #f44336; color: #f44336; }
  .btn.red:disabled { border-color: #5a2a2a; color: #5a2a2a; }
  .btn.orange { border-color: #ff9800; color: #ff9800; }
  .btn.blue   { border-color: #2196F3; color: #2196F3; }
  .btn.mark   { border-color: #9C27B0; color: #9C27B0; }
  .btn.mark:active { background: rgba(156,39,176,0.15); }

  /* QUESTION BAR */
  .q-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: #111;
    border-top: 2px solid #333;
    z-index: 60;
    min-height: 48px;
  }
  .q-bar h3 { color: #aaa; font-size: 13px; font-weight: 600; }
  .q-bar .q-count { color: #4CAF50; font-weight: 700; }
  .q-toggle {
    background: none; border: 1.5px solid #444; border-radius: 8px;
    padding: 7px 16px; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .q-toggle:active { background: #222; }
  .q-toggle.open { border-color: #9C27B0; color: #9C27B0; }

  /* QUESTION PANEL */
  .q-panel {
    position: fixed;
    bottom: 48px; left: 0; right: 0;
    max-height: 50vh;
    background: #0d0d0d;
    border-top: 2px solid #333;
    z-index: 55;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .q-panel.open { transform: translateY(0); }
  .q-panel::-webkit-scrollbar { width: 4px; }
  .q-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .q-panel .inner { padding: 10px 14px; padding-bottom: 20px; }

  .entry {
    display: flex; align-items: flex-start; padding: 7px 0;
    border-bottom: 1px solid #181818; gap: 8px;
  }
  .entry .num { color: #4CAF50; font-weight: 700; font-size: 14px; min-width: 24px; flex-shrink: 0; }
  .entry .wrap { flex: 1; min-width: 0; }
  .entry .qtext { color: #ddd; font-size: 13px; line-height: 1.35; }
  .entry .time { color: #555; font-size: 10px; display: block; margin-top: 2px; }

  .del-btn {
    background: none; border: none; cursor: pointer; font-size: 17px;
    opacity: 0.4; flex-shrink: 0; padding: 4px 6px; min-width: 28px;
    min-height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
  }
  .del-btn:active { opacity: 1; background: #1a1a1a; }

  .entry.dead { opacity: 0.38; }
  .entry.dead .num { color: #555; }
  .entry.dead .qtext { color: #666; text-decoration: line-through; }
  .entry.dead .time { color: #444; }

  .empty-msg { color: #444; font-size: 13px; font-style: italic; padding: 14px 0; text-align: center; }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Home</a>

<div class="top-bar">
  <div class="top-left">
    <div class="top-time" id="topTime"></div>
    <div class="top-date" id="topDate"></div>
  </div>
</div>

<div class="timer-wrap">
  <div class="timer" id="timer">00:0</div>
  <div class="btn-row">
    <button class="btn green"  id="startBtn" onclick="startTimer()">▶ Start</button>
    <button class="btn red"    id="stopBtn"  onclick="stopTimer()" disabled>⏸ Stop</button>
    <button class="btn mark"   id="markBtn"  onclick="markQuestion()">✓ Mark</button>
    <button class="btn orange" id="resetBtn" onclick="resetTimer()">↺ Reset</button>
    <button class="btn blue"   id="pdfBtn"   onclick="downloadPDF()">📄 PDF</button>
  </div>
</div>

<div class="q-bar">
  <h3>📋 Questions <span class="q-count" id="qCount"></span></h3>
  <button class="q-toggle" id="qToggle" onclick="toggleQPanel()">List ▼</button>
</div>

<div class="q-panel" id="qPanel">
  <div class="inner" id="questionList">
    <div class="empty-msg" id="emptyMsg">Tap <b>✓ Mark</b> to log a question</div>
  </div>
</div>

<script>
  const { jsPDF } = window.jspdf;

  let startTime = 0, elapsed = 0, interval = null, running = false;
  let questionCount = 0, timerStartedAt = null, timerEndedAt = null, questionData = [];

  const timer = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const qList = document.getElementById('questionList');
  const qCount = document.getElementById('qCount');
  const qPanel = document.getElementById('qPanel');
  const qToggle = document.getElementById('qToggle');

  function fmt(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  function ordinal(n) { return n <= 3 ? ['1st','2nd','3rd'][n-1] : n + 'th'; }

  function getLocalDate() {
    return new Date().toLocaleDateString('en-IN', { timeZone:'Asia/Kolkata', weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  }
  function getLocalTime() {
    return new Date().toLocaleTimeString('en-IN', { timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
  }
  function getLocalFullTime() { return getLocalDate() + '  ' + getLocalTime(); }

  function updateLocalTime() {
    var t = document.getElementById('topTime'), d = document.getElementById('topDate');
    if (t) t.textContent = getLocalTime();
    if (d) d.textContent = getLocalDate();
  }
  setInterval(updateLocalTime, 1000);
  updateLocalTime();

  function tick() { timer.textContent = fmt(elapsed + Date.now() - startTime); }

  function startTimer() {
    if (running) return;
    running = true; startTime = Date.now();
    if (!timerStartedAt) timerStartedAt = getLocalFullTime();
    interval = setInterval(tick, 50);
    timer.classList.remove('paused');
    startBtn.disabled = true; stopBtn.disabled = false;
  }
  function stopTimer() {
    if (!running) return;
    running = false; elapsed += Date.now() - startTime;
    clearInterval(interval); timer.classList.add('paused');
    timer.textContent = fmt(elapsed); timerEndedAt = getLocalFullTime();
    startBtn.disabled = false; stopBtn.disabled = true;
  }
  function resetTimer() {
    stopTimer(); elapsed = 0; timer.textContent = '00:0';
    timer.classList.remove('paused');
    startBtn.disabled = false; stopBtn.disabled = true;
    timerStartedAt = null; timerEndedAt = null;
    questionCount = 0; questionData = [];
    qCount.textContent = '';
    qList.innerHTML = '<div class="empty-msg" id="emptyMsg">Tap <b>✓ Mark</b> to log a question</div>';
    qPanel.classList.remove('open');
    qToggle.classList.remove('open'); qToggle.textContent = 'List ▼';
  }

  function toggleQPanel() {
    var isOpen = qPanel.classList.toggle('open');
    qToggle.classList.toggle('open', isOpen);
    qToggle.textContent = isOpen ? 'Close ▲' : 'List ▼';
  }

  function buildEntry(num, ord, timerStr, localStr) {
    var entry = document.createElement('div');
    entry.className = 'entry'; entry.dataset.status = 'alive';
    var numSpan = document.createElement('span');
    numSpan.className = 'num'; numSpan.textContent = num + ')';
    var wrap = document.createElement('span'); wrap.className = 'wrap';
    var qText = document.createElement('span');
    qText.className = 'qtext'; qText.textContent = 'You did your ' + ord + ' question';
    wrap.appendChild(qText);
    var timeSpan = document.createElement('span');
    timeSpan.className = 'time';
    timeSpan.textContent = '⏱ ' + timerStr + '  |  🕐 ' + localStr;
    wrap.appendChild(document.createElement('br'));
    wrap.appendChild(timeSpan);
    var delBtn = document.createElement('button');
    delBtn.className = 'del-btn'; delBtn.textContent = '🗑️'; delBtn.title = 'Delete';
    delBtn.onclick = function() { deleteQuestion(delBtn, entry); };
    entry.appendChild(numSpan); entry.appendChild(wrap); entry.appendChild(delBtn);
    return entry;
  }

  function markQuestion() {
    questionCount++;
    var em = document.getElementById('emptyMsg');
    if (em) em.remove();
    var currentTime = running ? elapsed + (Date.now() - startTime) : elapsed;
    var timerStr = fmt(currentTime), localStr = getLocalFullTime();
    questionData.push({ timerTime: timerStr, localTime: localStr, alive: true });
    qList.appendChild(buildEntry(questionCount, ordinal(questionCount), timerStr, localStr));
    qCount.textContent = '(' + questionCount + ')';
    qPanel.scrollTop = qPanel.scrollHeight;
  }

  function deleteQuestion(btn, entry) {
    if (entry.dataset.status === 'dead') return;
    entry.dataset.status = 'dead'; entry.classList.add('dead');
    btn.style.display = 'none'; renumberQuestions();
  }
  function renumberQuestions() {
    var entries = qList.querySelectorAll('.entry'), alive = 0;
    entries.forEach(function(e) {
      if (e.dataset.status === 'alive') {
        alive++;
        e.querySelector('.num').textContent = alive + ')';
        e.querySelector('.qtext').textContent = 'You did your ' + ordinal(alive) + ' question';
      }
    });
    questionCount = alive;
    qCount.textContent = alive > 0 ? '(' + alive + ')' : '';
  }

  var quotes = [
    "The expert in anything was once a beginner. Keep going! 🚀",
    "Small progress is still progress. You're doing great! 💪",
    "Consistency beats intensity. Keep showing up! 🔥",
    "Every question solved is a step closer to mastery. 🎯",
    "Don't stop when you're tired. Stop when you're done! 🏆",
    "The only bad workout is the one that didn't happen. ✨",
    "Believe you can and you're halfway there. 🌟",
    "Success is the sum of small efforts repeated daily. 📈",
    "You didn't come this far to only come this far. 💎",
    "Hard work beats talent when talent doesn't work hard. 🔑"
  ];

  function downloadPDF() {
    var alive = questionData.filter(function(q) { return q.alive; });
    if (alive.length === 0) { alert('No questions marked yet!'); return; }
    var doc = new jsPDF('p','mm','a4');
    var pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    var mg = 15, y = mg;
    doc.setFontSize(22); doc.setFont('helvetica','bold'); doc.setTextColor(30,30,30);
    doc.text('You did ' + alive.length + ' questions today', pw/2, y, {align:'center'});
    y += 4; doc.setDrawColor(0,150,0); doc.setLineWidth(0.8); doc.line(mg,y,pw-mg,y); y += 8;
    doc.setFontSize(11); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
    var today = new Date().toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'long',year:'numeric'});
    var si = timerStartedAt||getLocalFullTime(), ei = timerEndedAt||getLocalFullTime();
    doc.text('📅 Date: '+today,mg,y); y+=6;
    doc.text('▶ Started: '+si,mg,y); y+=6;
    doc.text('⏹ Ended: '+ei,mg,y); y+=8;
    doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(0,100,0);
    doc.text('Total Time: '+fmt(elapsed),mg,y); y+=8;
    var td=[], qn=0;
    for(var i=0;i<questionData.length;i++){
      if(questionData[i].alive){
        qn++; td.push([qn,'Question '+ordinal(qn),questionData[i].timerTime,questionData[i].localTime]);
      }
    }
    doc.autoTable({startY:y,head:[['#','Question','Timer','Local Time']],body:td,theme:'grid',
      styles:{fontSize:9,cellPadding:3,font:'helvetica'},
      headStyles:{fillColor:[34,34,34],textColor:[255,255,255],fontStyle:'bold',fontSize:10},
      alternateRowStyles:{fillColor:[245,250,245]},
      columnStyles:{0:{cellWidth:12,halign:'center'},1:{cellWidth:40},2:{cellWidth:30,halign:'center'},3:{cellWidth:45}},
      margin:{left:mg,right:mg}});
    y = doc.lastAutoTable.finalY+12;
    var q = quotes[Math.floor(Math.random()*quotes.length)];
    doc.setFontSize(13); doc.setFont('helvetica','italic'); doc.setTextColor(60,60,60);
    doc.text(q,pw/2,y,{align:'center'}); y+=6;
    doc.setDrawColor(180,180,180); doc.setLineWidth(0.3); doc.line(mg,y,pw-mg,y); y+=8;
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(150,150,150);
    doc.text('by Harsh',pw/2,ph-10,{align:'center'});
    var cd = today.replace(/,/g,'').replace(/\s+/g,'_');
    doc.save(alive.length+' question did on '+cd+'.pdf');
  }
</script>

</html>
